name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v0.4.0
            directory: .
            lockfile: package-lock.json
          - name: legacy
            directory: legacy
            lockfile: legacy/package-lock.json
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
